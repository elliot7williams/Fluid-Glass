<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Liquid Glass Fluid — Screensaver</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #050508;
    cursor: none;                 /* start hidden */
    font-family: system-ui, -apple-system, sans-serif;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
  }
  /* tiny fade-in so it doesn’t flash white on load */
  body { opacity: 0; transition: opacity 0.8s ease; }
  body.ready { opacity: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
// ─────────────────────────────────────────────────────────────
// Liquid Glass Fluid — Screensaver Edition
// Continuous gentle demo flow + classic screensaver behaviour
// ─────────────────────────────────────────────────────────────

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { alpha: false, antialias: false, preserveDrawingBuffer: false });
if (!gl) { document.body.innerHTML = '<p style="color:#fff;padding:2rem">WebGL required</p>'; throw new Error('no webgl'); }

const EXT = {
  float: gl.getExtension('OES_texture_float'),
  halfFloat: gl.getExtension('OES_texture_half_float'),
};
const texType = EXT.float ? gl.FLOAT : (EXT.halfFloat ? EXT.halfFloat.HALF_FLOAT_OES : gl.UNSIGNED_BYTE);

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = Math.floor(innerWidth  * dpr);
  canvas.height = Math.floor(innerHeight * dpr);
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

// ── helpers ──────────────────────────────────────────────────
function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s));
    throw new Error('shader compile');
  }
  return s;
}
function program(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(p));
    throw new Error('link');
  }
  return p;
}

const VS = `
attribute vec2 a_pos;
varying vec2 v_uv;
void main() {
  v_uv = a_pos * 0.5 + 0.5;
  gl_Position = vec4(a_pos, 0.0, 1.0);
}`;

const SIM_RES = 256;
const DYE_RES = 512;

function createFBO(w, h) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, texType, null);

  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.viewport(0, 0, w, h);
  gl.clear(gl.COLOR_BUFFER_BIT);
  return { tex, fbo, w, h };
}

function createDouble(w, h) {
  return {
    read: createFBO(w, h),
    write: createFBO(w, h),
    swap() { const t = this.read; this.read = this.write; this.write = t; }
  };
}

const velocity = createDouble(SIM_RES, SIM_RES);
const density  = createDouble(DYE_RES, DYE_RES);
const pressure = createDouble(SIM_RES, SIM_RES);
const divergence = createFBO(SIM_RES, SIM_RES);
const curl       = createFBO(SIM_RES, SIM_RES);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

function bindQuad(prog) {
  const loc = gl.getAttribLocation(prog, 'a_pos');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
}

function blit(target) {
  if (target == null) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
  } else {
    gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
    gl.viewport(0, 0, target.w, target.h);
  }
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// ── shaders ──────────────────────────────────────────────────
const clearProg = program(VS, `
precision mediump float;
varying vec2 v_uv;
uniform float value;
void main() { gl_FragColor = vec4(value); }
`);

const splatProg = program(VS, `
precision highp float;
varying vec2 v_uv;
uniform sampler2D u_target;
uniform float aspect;
uniform vec3  color;
uniform vec2  point;
uniform float radius;
void main() {
  vec2 p = v_uv - point.xy;
  p.x *= aspect;
  vec3 splat = exp(-dot(p,p) / radius) * color;
  vec3 base  = texture2D(u_target, v_uv).xyz;
  gl_FragColor = vec4(base + splat, 1.0);
}
`);

const advectProg = program(VS, `
precision highp float;
varying vec2 v_uv;
uniform sampler2D u_velocity;
uniform sampler2D u_source;
uniform vec2 texel;
uniform float dt;
uniform float dissipation;
void main() {
  vec2 coord = v_uv - dt * texture2D(u_velocity, v_uv).xy * texel;
  gl_FragColor = dissipation * texture2D(u_source, coord);
}
`);

const divergenceProg = program(VS, `
precision mediump float;
varying vec2 v_uv;
uniform sampler2D u_velocity;
uniform vec2 texel;
void main() {
  float L = texture2D(u_velocity, v_uv - vec2(texel.x, 0.0)).x;
  float R = texture2D(u_velocity, v_uv + vec2(texel.x, 0.0)).x;
  float T = texture2D(u_velocity, v_uv + vec2(0.0, texel.y)).y;
  float B = texture2D(u_velocity, v_uv - vec2(0.0, texel.y)).y;
  float div = 0.5 * (R - L + T - B);
  gl_FragColor = vec4(div, 0.0, 0.0, 1.0);
}
`);

const curlProg = program(VS, `
precision mediump float;
varying vec2 v_uv;
uniform sampler2D u_velocity;
uniform vec2 texel;
void main() {
  float L = texture2D(u_velocity, v_uv - vec2(texel.x, 0.0)).y;
  float R = texture2D(u_velocity, v_uv + vec2(texel.x, 0.0)).y;
  float T = texture2D(u_velocity, v_uv + vec2(0.0, texel.y)).x;
  float B = texture2D(u_velocity, v_uv - vec2(0.0, texel.y)).x;
  float vort = R - L - T + B;
  gl_FragColor = vec4(0.5 * vort, 0.0, 0.0, 1.0);
}
`);

const vorticityProg = program(VS, `
precision highp float;
varying vec2 v_uv;
uniform sampler2D u_velocity;
uniform sampler2D u_curl;
uniform vec2 texel;
uniform float curl_strength;
uniform float dt;
void main() {
  float L = texture2D(u_curl, v_uv - vec2(texel.x, 0.0)).x;
  float R = texture2D(u_curl, v_uv + vec2(texel.x, 0.0)).x;
  float T = texture2D(u_curl, v_uv + vec2(0.0, texel.y)).x;
  float B = texture2D(u_curl, v_uv - vec2(0.0, texel.y)).x;
  float C = texture2D(u_curl, v_uv).x;
  vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
  force /= length(force) + 0.0001;
  force *= curl_strength * C;
  force.y *= -1.0;
  vec2 vel = texture2D(u_velocity, v_uv).xy;
  gl_FragColor = vec4(vel + force * dt, 0.0, 1.0);
}
`);

const pressureProg = program(VS, `
precision mediump float;
varying vec2 v_uv;
uniform sampler2D u_pressure;
uniform sampler2D u_divergence;
uniform vec2 texel;
void main() {
  float L = texture2D(u_pressure, v_uv - vec2(texel.x, 0.0)).x;
  float R = texture2D(u_pressure, v_uv + vec2(texel.x, 0.0)).x;
  float T = texture2D(u_pressure, v_uv + vec2(0.0, texel.y)).x;
  float B = texture2D(u_pressure, v_uv - vec2(0.0, texel.y)).x;
  float C = texture2D(u_divergence, v_uv).x;
  float pressure = (L + R + B + T - C) * 0.25;
  gl_FragColor = vec4(pressure, 0.0, 0.0, 1.0);
}
`);

const gradientProg = program(VS, `
precision mediump float;
varying vec2 v_uv;
uniform sampler2D u_pressure;
uniform sampler2D u_velocity;
uniform vec2 texel;
void main() {
  float L = texture2D(u_pressure, v_uv - vec2(texel.x, 0.0)).x;
  float R = texture2D(u_pressure, v_uv + vec2(texel.x, 0.0)).x;
  float T = texture2D(u_pressure, v_uv + vec2(0.0, texel.y)).x;
  float B = texture2D(u_pressure, v_uv - vec2(0.0, texel.y)).x;
  vec2 vel = texture2D(u_velocity, v_uv).xy;
  vel.xy -= vec2(R - L, T - B);
  gl_FragColor = vec4(vel, 0.0, 1.0);
}
`);

const displayProg = program(VS, `
precision highp float;
varying vec2 v_uv;
uniform sampler2D u_density;
uniform sampler2D u_velocity;
uniform vec2  resolution;
uniform float time;

float hash(vec2 p) {
  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

void main() {
  vec2 uv = v_uv;
  vec3 dens = texture2D(u_density, uv).rgb;
  vec2 vel  = texture2D(u_velocity, uv).xy;

  float densAmt = length(dens);
  vec2 grad = vec2(
    length(texture2D(u_density, uv + vec2(1.5/resolution.x, 0.0)).rgb) -
    length(texture2D(u_density, uv - vec2(1.5/resolution.x, 0.0)).rgb),
    length(texture2D(u_density, uv + vec2(0.0, 1.5/resolution.y)).rgb) -
    length(texture2D(u_density, uv - vec2(0.0, 1.5/resolution.y)).rgb)
  );

  float refractStrength = densAmt * 0.035 + length(vel) * 0.008;
  vec2 refractedUV = uv - grad * refractStrength * 12.0;
  dens = texture2D(u_density, refractedUV).rgb;
  densAmt = length(dens);

  vec3 col = dens * 2.2;
  float edge = length(grad) * 4.0;
  col += vec3(0.7, 0.9, 1.0) * edge * densAmt * 0.22;

  float grain = (hash(uv * resolution + time) - 0.5) * 0.025;
  col += grain;

  vec3 bg = vec3(0.02, 0.015, 0.03);
  col = mix(bg, col, smoothstep(0.0, 0.07, densAmt));

  float vig = 1.0 - smoothstep(0.45, 1.45, length(uv - 0.5) * 1.35);
  col *= vig;

  gl_FragColor = vec4(col, 1.0);
}
`);

function setUniforms(prog, uniforms) {
  for (const [name, val] of Object.entries(uniforms)) {
    const loc = gl.getUniformLocation(prog, name);
    if (loc === null) continue;
    if (typeof val === 'number') gl.uniform1f(loc, val);
    else if (val.length === 2) gl.uniform2f(loc, val[0], val[1]);
    else if (val.length === 3) gl.uniform3f(loc, val[0], val[1], val[2]);
    else if (val.tex !== undefined) {
      gl.activeTexture(gl.TEXTURE0 + val.unit);
      gl.bindTexture(gl.TEXTURE_2D, val.tex);
      gl.uniform1i(loc, val.unit);
    }
  }
}

// ── simulation ───────────────────────────────────────────────
const config = {
  VELOCITY_DISSIPATION: 0.985,
  DENSITY_DISSIPATION:  0.978,
  PRESSURE: 0.8,
  PRESSURE_ITERATIONS: 18,
  CURL: 28,
  SPLAT_RADIUS: 0.0028,
};

function step(dt) {
  gl.disable(gl.BLEND);

  gl.useProgram(curlProg);
  bindQuad(curlProg);
  setUniforms(curlProg, {
    u_velocity: { tex: velocity.read.tex, unit: 0 },
    texel: [1/SIM_RES, 1/SIM_RES]
  });
  blit(curl);

  gl.useProgram(vorticityProg);
  bindQuad(vorticityProg);
  setUniforms(vorticityProg, {
    u_velocity: { tex: velocity.read.tex, unit: 0 },
    u_curl:     { tex: curl.tex, unit: 1 },
    texel: [1/SIM_RES, 1/SIM_RES],
    curl_strength: config.CURL,
    dt
  });
  blit(velocity.write);
  velocity.swap();

  gl.useProgram(divergenceProg);
  bindQuad(divergenceProg);
  setUniforms(divergenceProg, {
    u_velocity: { tex: velocity.read.tex, unit: 0 },
    texel: [1/SIM_RES, 1/SIM_RES]
  });
  blit(divergence);

  gl.useProgram(clearProg);
  bindQuad(clearProg);
  setUniforms(clearProg, { value: config.PRESSURE });
  blit(pressure.write);
  pressure.swap();

  gl.useProgram(pressureProg);
  bindQuad(pressureProg);
  for (let i = 0; i < config.PRESSURE_ITERATIONS; i++) {
    setUniforms(pressureProg, {
      u_pressure:   { tex: pressure.read.tex, unit: 0 },
      u_divergence: { tex: divergence.tex, unit: 1 },
      texel: [1/SIM_RES, 1/SIM_RES]
    });
    blit(pressure.write);
    pressure.swap();
  }

  gl.useProgram(gradientProg);
  bindQuad(gradientProg);
  setUniforms(gradientProg, {
    u_pressure: { tex: pressure.read.tex, unit: 0 },
    u_velocity: { tex: velocity.read.tex, unit: 1 },
    texel: [1/SIM_RES, 1/SIM_RES]
  });
  blit(velocity.write);
  velocity.swap();

  gl.useProgram(advectProg);
  bindQuad(advectProg);
  setUniforms(advectProg, {
    u_velocity: { tex: velocity.read.tex, unit: 0 },
    u_source:   { tex: velocity.read.tex, unit: 0 },
    texel: [1/SIM_RES, 1/SIM_RES],
    dt,
    dissipation: config.VELOCITY_DISSIPATION
  });
  blit(velocity.write);
  velocity.swap();

  setUniforms(advectProg, {
    u_velocity: { tex: velocity.read.tex, unit: 0 },
    u_source:   { tex: density.read.tex, unit: 1 },
    texel: [1/DYE_RES, 1/DYE_RES],
    dt,
    dissipation: config.DENSITY_DISSIPATION
  });
  blit(density.write);
  density.swap();
}

function splat(x, y, dx, dy, color) {
  gl.useProgram(splatProg);
  bindQuad(splatProg);
  setUniforms(splatProg, {
    u_target: { tex: velocity.read.tex, unit: 0 },
    aspect: canvas.width / canvas.height,
    point: [x, y],
    color: [dx, dy, 0],
    radius: config.SPLAT_RADIUS
  });
  blit(velocity.write);
  velocity.swap();

  setUniforms(splatProg, {
    u_target: { tex: density.read.tex, unit: 0 },
    aspect: canvas.width / canvas.height,
    point: [x, y],
    color: color,
    radius: config.SPLAT_RADIUS * 1.6
  });
  blit(density.write);
  density.swap();
}

function HSVtoRGB(h, s, v) {
  let r, g, b, i, f, p, q, t;
  i = Math.floor(h * 6);
  f = h * 6 - i;
  p = v * (1 - s);
  q = v * (1 - f * s);
  t = v * (1 - (1 - f) * s);
  switch (i % 6) {
    case 0: r = v; g = t; b = p; break;
    case 1: r = q; g = v; b = p; break;
    case 2: r = p; g = v; b = t; break;
    case 3: r = p; g = q; b = v; break;
    case 4: r = t; g = p; b = v; break;
    case 5: r = v; g = p; b = q; break;
  }
  return [r, g, b];
}

function generateColor() {
  let h = Math.random() < 0.55 ? Math.random() : (0.32 + Math.random() * 0.48);
  const s = 0.72 + Math.random() * 0.28;
  const v = 0.62 + Math.random() * 0.38;
  const c = HSVtoRGB(h, s, v);
  return [c[0] * 0.20, c[1] * 0.20, c[2] * 0.20];
}

// ── continuous gentle idle flow (screensaver mode) ───────────
function idleSplat() {
  const x = 0.18 + Math.random() * 0.64;
  const y = 0.18 + Math.random() * 0.64;
  const angle = Math.random() * Math.PI * 2;
  const force = 140 + Math.random() * 380;
  splat(x, y, Math.cos(angle) * force, Math.sin(angle) * force, generateColor());
}

// richer starting plume
function multipleSplats(n) {
  for (let i = 0; i < n; i++) {
    const x = Math.random();
    const y = Math.random();
    const dx = 800 * (Math.random() - 0.5);
    const dy = 800 * (Math.random() - 0.5);
    splat(x, y, dx, dy, generateColor());
  }
}
multipleSplats(24);

// ── screensaver behaviour ────────────────────────────────────
let nextIdle = 0;
let lastInput = performance.now();
const EXIT_AFTER_INPUT = true;   // classic screensaver: any input closes it

function requestFullscreen() {
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
}

function exitScreensaver() {
  // Try to close the window (works when launched as a standalone / Electron / .scr)
  try { window.close(); } catch (e) {}
  // Fallback: just leave fullscreen
  if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
  else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
}

function onUserInput() {
  lastInput = performance.now();
  if (EXIT_AFTER_INPUT) {
    exitScreensaver();
  }
}

// Any real input exits (classic screensaver feel)
['mousedown', 'mousemove', 'keydown', 'touchstart', 'touchmove', 'wheel'].forEach(evt => {
  window.addEventListener(evt, onUserInput, { passive: true });
});

// Also exit if the user somehow leaves fullscreen
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && EXIT_AFTER_INPUT) {
    // user pressed Esc → treat as exit
    try { window.close(); } catch (e) {}
  }
});

// ── main loop ────────────────────────────────────────────────
let last = performance.now();
document.body.classList.add('ready');

// Auto-enter fullscreen after a short delay (gives the browser a moment)
setTimeout(requestFullscreen, 600);

function frame() {
  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 0.0166);
  last = now;

  // Continuous gentle flow – always on in screensaver mode
  if (now > nextIdle) {
    idleSplat();
    nextIdle = now + 300 + Math.random() * 450;
  }

  step(dt);

  gl.useProgram(displayProg);
  bindQuad(displayProg);
  setUniforms(displayProg, {
    u_density:  { tex: density.read.tex, unit: 0 },
    u_velocity: { tex: velocity.read.tex, unit: 1 },
    resolution: [canvas.width, canvas.height],
    time: now * 0.001
  });
  blit(null);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
