<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Liquid Glass Ink — Ultra</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#020206; }
  body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .ui { position:fixed; inset:0; pointer-events:none; }
  .topbar {
    position:absolute; top:18px; left:50%; transform:translateX(-50%);
    display:flex; gap:8px; align-items:center; padding:7px;
    border:1px solid rgba(255,255,255,.13); border-radius:18px;
    background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.055));
    box-shadow:0 12px 48px rgba(0,0,0,.35), inset 0 1px rgba(255,255,255,.16);
    backdrop-filter:blur(22px) saturate(140%); -webkit-backdrop-filter:blur(22px) saturate(140%);
    pointer-events:auto; transition:opacity .35s ease, transform .35s ease;
  }
  button {
    appearance:none; border:0; color:rgba(255,255,255,.88); cursor:pointer;
    background:rgba(255,255,255,.075); border:1px solid rgba(255,255,255,.1);
    border-radius:12px; height:34px; padding:0 13px; font:600 12px/1 system-ui;
    letter-spacing:.02em; transition:background .2s ease, transform .2s ease;
  }
  button:hover { background:rgba(255,255,255,.14); }
  button:active { transform:scale(.96); }
  button.active { background:rgba(196,255,226,.16); border-color:rgba(202,255,231,.25); }
  .hint {
    position:absolute; left:50%; bottom:24px; transform:translateX(-50%);
    color:rgba(255,255,255,.48); font-size:12px; font-weight:540; letter-spacing:.045em;
    text-shadow:0 1px 12px rgba(0,0,0,.6); transition:opacity 1.1s ease;
  }
  .hint.hide { opacity:0; }
  .badge {
    position:absolute; left:20px; top:20px; padding:8px 11px; border-radius:12px;
    color:rgba(255,255,255,.58); font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    background:rgba(0,0,0,.22); border:1px solid rgba(255,255,255,.08); backdrop-filter:blur(12px);
  }
  .error {
    display:none; position:fixed; inset:0; place-items:center; padding:32px; color:#fff; text-align:center;
    background:radial-gradient(circle at center,#16122a,#030306 65%); z-index:10;
  }
  .error.show { display:grid; }
  .error div { max-width:680px; line-height:1.55; color:rgba(255,255,255,.75); }
  .error b { display:block; margin-bottom:8px; color:#fff; font-size:18px; }
  @media (max-width:680px) {
    .badge { display:none; }
    .topbar { top:12px; max-width:calc(100vw - 20px); }
    button { padding:0 10px; font-size:11px; }
    .hint { width:90vw; text-align:center; bottom:18px; }
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="ui">
  <div class="badge">GPU FLUID · GLASS</div>
  <div class="topbar" id="controls">
    <button id="burst">Ink burst</button>
    <button id="auto" class="active">Auto plume</button>
    <button id="glass" class="active">Glass</button>
    <button id="clear">Clear</button>
  </div>
  <div class="hint" id="hint">Drag slowly to fold the ink · tap for a glassy bloom</div>
</div>
<div class="error" id="error"><div><b>WebGL floating-point rendering is required.</b>This demo uses floating-point framebuffers for velocity, pressure and dye. Try a current Safari, Chrome, Edge or Firefox build with hardware acceleration enabled.</div></div>
<script>
(() => {
'use strict';

const canvas = document.getElementById('gl');
const hint = document.getElementById('hint');
const errorBox = document.getElementById('error');
const gl = canvas.getContext('webgl', {
  alpha:false,
  antialias:false,
  depth:false,
  stencil:false,
  premultipliedAlpha:false,
  preserveDrawingBuffer:false,
  powerPreference:'high-performance'
});
if (!gl) { errorBox.classList.add('show'); return; }

// ---------- capabilities ----------
const extFloat = gl.getExtension('OES_texture_float');
const extHalf = gl.getExtension('OES_texture_half_float');
const extFloatLinear = gl.getExtension('OES_texture_float_linear');
const extHalfLinear = gl.getExtension('OES_texture_half_float_linear');
const extColorFloat = gl.getExtension('WEBGL_color_buffer_float');
const extColorHalf = gl.getExtension('EXT_color_buffer_half_float');

let texType = null;
if (extHalf && extColorHalf) texType = extHalf.HALF_FLOAT_OES;
else if (extFloat && extColorFloat) texType = gl.FLOAT;
if (!texType) { errorBox.classList.add('show'); return; }
const canLinear = (texType === gl.FLOAT ? !!extFloatLinear : !!extHalfLinear);

const CFG = {
  SIM: 256,
  DYE: 768,
  BLOOM: 384,
  VELOCITY_DISSIPATION: .987,
  DYE_DISSIPATION: .9925,
  PRESSURE_DISSIPATION: .80,
  PRESSURE_ITERS: 28,
  CURL: 36,
  SPLAT_RADIUS: .00165,
  FORCE: 5200,
  BLOOM_STRENGTH: .66,
  GLASS_STRENGTH: 1.0,
  AUTO: true,
  GLASS: true
};

function compile(type, src) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, src);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    console.error(src, gl.getShaderInfoLog(shader));
    throw new Error(gl.getShaderInfoLog(shader) || 'shader compile error');
  }
  return shader;
}
function makeProgram(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p) || 'program link error');
  p.uniforms = Object.create(null);
  return p;
}
function U(p, name) {
  if (!(name in p.uniforms)) p.uniforms[name] = gl.getUniformLocation(p, name);
  return p.uniforms[name];
}
function tex(unit, texture, p, name) {
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.uniform1i(U(p,name), unit);
}

const VS = `
attribute vec2 a_position;
varying vec2 v_uv;
void main(){
  v_uv = a_position * .5 + .5;
  gl_Position = vec4(a_position,0.,1.);
}`;

const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
function use(p) {
  gl.useProgram(p);
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  const a = gl.getAttribLocation(p,'a_position');
  gl.enableVertexAttribArray(a);
  gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);
}
function draw(target) {
  if (target) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
    gl.viewport(0,0,target.w,target.h);
  } else {
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
    gl.viewport(0,0,canvas.width,canvas.height);
  }
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}
function createFBO(w,h,type=texType,filter=canLinear?gl.LINEAR:gl.NEAREST) {
  const texture=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,texture);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,filter);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,filter);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,type,null);
  const fbo=gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,texture,0);
  const status=gl.checkFramebufferStatus(gl.FRAMEBUFFER);
  if(status!==gl.FRAMEBUFFER_COMPLETE) throw new Error('Framebuffer incomplete: '+status.toString(16));
  gl.viewport(0,0,w,h);
  gl.clearColor(0,0,0,1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  return {texture,fbo,w,h};
}
function createDouble(w,h) {
  const o={read:createFBO(w,h),write:createFBO(w,h)};
  o.swap=()=>{const t=o.read;o.read=o.write;o.write=t;};
  return o;
}

let velocity=createDouble(CFG.SIM,CFG.SIM);
let dye=createDouble(CFG.DYE,CFG.DYE);
let pressure=createDouble(CFG.SIM,CFG.SIM);
let divergence=createFBO(CFG.SIM,CFG.SIM);
let curl=createFBO(CFG.SIM,CFG.SIM);
let scene=null,bloomA=null,bloomB=null;

function resizePost() {
  const dpr=Math.min(devicePixelRatio||1,2);
  const w=Math.max(2,Math.floor(innerWidth*dpr));
  const h=Math.max(2,Math.floor(innerHeight*dpr));
  if(canvas.width===w && canvas.height===h && scene) return;
  canvas.width=w; canvas.height=h;
  if(scene){
    [scene,bloomA,bloomB].forEach(x=>{ gl.deleteTexture(x.texture); gl.deleteFramebuffer(x.fbo); });
  }
  scene=createFBO(w,h,texType,canLinear?gl.LINEAR:gl.NEAREST);
  const ar=w/h;
  const bw=CFG.BLOOM;
  const bh=Math.max(64,Math.round(CFG.BLOOM/ar));
  bloomA=createFBO(bw,bh,texType,canLinear?gl.LINEAR:gl.NEAREST);
  bloomB=createFBO(bw,bh,texType,canLinear?gl.LINEAR:gl.NEAREST);
}
addEventListener('resize',resizePost,{passive:true});
resizePost();

// ---------- simulation shaders ----------
const copyP=makeProgram(VS,`
precision highp float; varying vec2 v_uv; uniform sampler2D u_tex; uniform float u_scale;
void main(){gl_FragColor=texture2D(u_tex,v_uv)*u_scale;}`);

const splatP=makeProgram(VS,`
precision highp float;
varying vec2 v_uv;
uniform sampler2D u_target;
uniform vec2 u_point;
uniform vec3 u_color;
uniform float u_aspect;
uniform float u_radius;
uniform float u_core;
void main(){
  vec2 p=v_uv-u_point; p.x*=u_aspect;
  float d=dot(p,p);
  float soft=exp(-d/u_radius);
  float core=exp(-d/(u_radius*.18));
  vec3 base=texture2D(u_target,v_uv).xyz;
  gl_FragColor=vec4(base+u_color*(soft+core*u_core),1.);
}`);

const advectP=makeProgram(VS,`
precision highp float;
varying vec2 v_uv;
uniform sampler2D u_velocity;
uniform sampler2D u_source;
uniform vec2 u_velocityTexel;
uniform float u_dt;
uniform float u_dissipation;
void main(){
  vec2 vel=texture2D(u_velocity,v_uv).xy;
  vec2 coord=v_uv-u_dt*vel*u_velocityTexel;
  gl_FragColor=texture2D(u_source,coord)*u_dissipation;
}`);

const divergenceP=makeProgram(VS,`
precision highp float; varying vec2 v_uv; uniform sampler2D u_velocity; uniform vec2 u_texel;
void main(){
  vec2 L=texture2D(u_velocity,v_uv-vec2(u_texel.x,0.)).xy;
  vec2 R=texture2D(u_velocity,v_uv+vec2(u_texel.x,0.)).xy;
  vec2 B=texture2D(u_velocity,v_uv-vec2(0.,u_texel.y)).xy;
  vec2 T=texture2D(u_velocity,v_uv+vec2(0.,u_texel.y)).xy;
  float div=.5*(R.x-L.x+T.y-B.y);
  gl_FragColor=vec4(div,0.,0.,1.);
}`);

const curlP=makeProgram(VS,`
precision highp float; varying vec2 v_uv; uniform sampler2D u_velocity; uniform vec2 u_texel;
void main(){
 float L=texture2D(u_velocity,v_uv-vec2(u_texel.x,0.)).y;
 float R=texture2D(u_velocity,v_uv+vec2(u_texel.x,0.)).y;
 float B=texture2D(u_velocity,v_uv-vec2(0.,u_texel.y)).x;
 float T=texture2D(u_velocity,v_uv+vec2(0.,u_texel.y)).x;
 gl_FragColor=vec4(.5*(R-L-T+B),0.,0.,1.);
}`);

const vortP=makeProgram(VS,`
precision highp float; varying vec2 v_uv;
uniform sampler2D u_velocity; uniform sampler2D u_curl; uniform vec2 u_texel; uniform float u_curlStrength; uniform float u_dt;
void main(){
 float L=abs(texture2D(u_curl,v_uv-vec2(u_texel.x,0.)).x);
 float R=abs(texture2D(u_curl,v_uv+vec2(u_texel.x,0.)).x);
 float B=abs(texture2D(u_curl,v_uv-vec2(0.,u_texel.y)).x);
 float T=abs(texture2D(u_curl,v_uv+vec2(0.,u_texel.y)).x);
 float C=texture2D(u_curl,v_uv).x;
 vec2 f=.5*vec2(T-B,R-L);
 f/=length(f)+.0001;
 f*=u_curlStrength*C;
 f.y*=-1.;
 vec2 v=texture2D(u_velocity,v_uv).xy;
 gl_FragColor=vec4(v+f*u_dt,0.,1.);
}`);

const pressureP=makeProgram(VS,`
precision highp float; varying vec2 v_uv;
uniform sampler2D u_pressure; uniform sampler2D u_divergence; uniform vec2 u_texel;
void main(){
 float L=texture2D(u_pressure,v_uv-vec2(u_texel.x,0.)).x;
 float R=texture2D(u_pressure,v_uv+vec2(u_texel.x,0.)).x;
 float B=texture2D(u_pressure,v_uv-vec2(0.,u_texel.y)).x;
 float T=texture2D(u_pressure,v_uv+vec2(0.,u_texel.y)).x;
 float D=texture2D(u_divergence,v_uv).x;
 gl_FragColor=vec4((L+R+B+T-D)*.25,0.,0.,1.);
}`);

const gradP=makeProgram(VS,`
precision highp float; varying vec2 v_uv;
uniform sampler2D u_pressure; uniform sampler2D u_velocity; uniform vec2 u_texel;
void main(){
 float L=texture2D(u_pressure,v_uv-vec2(u_texel.x,0.)).x;
 float R=texture2D(u_pressure,v_uv+vec2(u_texel.x,0.)).x;
 float B=texture2D(u_pressure,v_uv-vec2(0.,u_texel.y)).x;
 float T=texture2D(u_pressure,v_uv+vec2(0.,u_texel.y)).x;
 vec2 v=texture2D(u_velocity,v_uv).xy-.5*vec2(R-L,T-B);
 gl_FragColor=vec4(v,0.,1.);
}`);

// ---------- display / liquid glass ----------
const sceneP=makeProgram(VS,`
precision highp float;
varying vec2 v_uv;
uniform sampler2D u_dye;
uniform sampler2D u_velocity;
uniform vec2 u_resolution;
uniform float u_time;
uniform float u_glass;

float sat(float x){return clamp(x,0.,1.);}
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}
float noise(vec2 p){
 vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
 return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);
}
float fbm(vec2 p){
 float f=0.; f+=.5*noise(p); p*=2.03; f+=.25*noise(p); p*=2.01; f+=.125*noise(p); return f;
}
vec3 palette(float t){
 // Thin-film style emerald -> cyan -> violet -> magenta iridescence
 vec3 a=vec3(.49,.50,.53), b=vec3(.48,.48,.50), c=vec3(1.0,.96,.90), d=vec3(.17,.38,.64);
 return a+b*cos(6.28318*(c*t+d));
}
float amount(vec2 uv){return dot(texture2D(u_dye,uv).rgb,vec3(.42,.42,.28));}
vec2 normalField(vec2 uv, float px){
 vec2 e=vec2(px,px*u_resolution.x/u_resolution.y);
 float l=amount(uv-vec2(e.x,0.)); float r=amount(uv+vec2(e.x,0.));
 float b=amount(uv-vec2(0.,e.y)); float t=amount(uv+vec2(0.,e.y));
 return vec2(r-l,t-b);
}
void main(){
 vec2 uv=v_uv;
 vec2 aspectUV=(uv-.5)*vec2(u_resolution.x/u_resolution.y,1.);
 vec2 vel=texture2D(u_velocity,uv).xy;
 float den=amount(uv);

 // Slowly moving optical wave field layered with actual fluid normals.
 vec2 n1=normalField(uv,1.5/u_resolution.x);
 vec2 n2=normalField(uv+vec2(.003,-.002),4.5/u_resolution.x);
 float wave=fbm(aspectUV*3.15+vec2(u_time*.055,-u_time*.038));
 float wave2=fbm(aspectUV*6.4+vec2(-u_time*.035,u_time*.051));
 vec2 micro=vec2(
   noise(aspectUV*12.+vec2(u_time*.13,0.))-0.5,
   noise(aspectUV*12.+vec2(3.1,-u_time*.11))-0.5
 );
 vec2 N=(n1*3.2+n2*1.35+micro*.025*(wave+.15))*u_glass;

 // Refraction gets dramatically stronger in thick folds, but remains smooth in smoke.
 float lens=sat(den*2.1) * (.010+.027*sat(den)) * u_glass;
 lens += (wave-.5)*.0027*u_glass;
 vec2 refr=uv-N*lens-vel*(.000014+.000024*sat(den))*u_glass;

 // Chromatic dispersion: each channel travels through a slightly different optical path.
 vec2 chroma=N*(.0018+.0036*sat(den))*u_glass;
 vec3 d0=texture2D(u_dye,refr).rgb;
 vec3 dR=texture2D(u_dye,refr+chroma).rgb;
 vec3 dB=texture2D(u_dye,refr-chroma*.85).rgb;
 vec3 d=vec3(dR.r,d0.g,dB.b);
 float a=dot(d,vec3(.38,.43,.19));

 // Iridescent body color follows density, dye channels, velocity and surface orientation.
 float phase = a*.55 + d.g*.38 + d.b*.62 + length(vel)*.012 + dot(normalize(N+1e-4),vec2(.67,-.74))*.08;
 vec3 iri=palette(phase+.10+wave2*.08);
 vec3 emerald=vec3(.025,.93,.53);
 vec3 violet=vec3(.59,.12,1.00);
 vec3 cyan=vec3(.06,.93,1.05);
 vec3 body=mix(emerald,violet,sat(d.r*.62+d.b*.8+phase*.18));
 body=mix(body,cyan,sat(d.g*.65-wave*.18)*.42);
 body=mix(body,iri,.50+.26*sat(a));

 // Soft volumetric interior. Multiple nonlinear layers make ink feel deep rather than flat.
 float fog=smoothstep(.012,.20,a);
 float core=smoothstep(.09,.86,a);
 float thin=smoothstep(.018,.13,a)*(1.-smoothstep(.25,.9,a));
 body*= (.38 + a*2.25 + core*.58);
 body += iri*thin*.22;

 // Glass lighting: pseudo-normal + two moving area lights + rim caustic.
 vec3 normal=normalize(vec3(-N*24.,1.));
 vec3 light1=normalize(vec3(-.55,.75,.95));
 vec3 light2=normalize(vec3(.75,-.24,.62));
 float spec1=pow(max(dot(normal,light1),0.),42.);
 float spec2=pow(max(dot(normal,light2),0.),16.);
 float edge=length(n1)*11.+length(n2)*4.;
 float fres=pow(1.-max(normal.z,0.),2.8);
 float caustic=sat(edge*1.8)*(0.35+0.65*wave2);
 vec3 glassLight=vec3(.72,.94,1.08)*spec1*1.75 + vec3(1.0,.55,1.05)*spec2*.55;
 glassLight += palette(phase+.35)*caustic*.32 + vec3(.72,.86,1.)*fres*.24;

 // Deep near-black liquid background with subtle spectral atmosphere.
 float radial=exp(-dot(aspectUV,aspectUV)*1.7);
 vec3 bg=vec3(.003,.004,.012);
 bg += vec3(.012,.006,.026)*radial;
 bg += palette(wave*.16+.36)*(.007+.012*radial);

 vec3 col=mix(bg,body,fog);
 col+=glassLight*fog*u_glass;
 col+=body*core*.15;

 // Fine suspended-particle sparkle only inside thin smoke edges.
 float grain=hash(gl_FragCoord.xy+fract(u_time)*129.7)-.5;
 col += grain*.012*(.15+thin);

 // Filmic shoulder before bloom.
 col=max(col,0.);
 col=col/(1.+col*.40);
 gl_FragColor=vec4(col,1.);
}`);

const brightP=makeProgram(VS,`
precision highp float; varying vec2 v_uv; uniform sampler2D u_scene;
void main(){
 vec3 c=texture2D(u_scene,v_uv).rgb;
 float l=max(max(c.r,c.g),c.b);
 float k=smoothstep(.34,1.25,l);
 gl_FragColor=vec4(c*k,1.);
}`);

const blurP=makeProgram(VS,`
precision highp float; varying vec2 v_uv; uniform sampler2D u_tex; uniform vec2 u_dir;
void main(){
 vec3 c=texture2D(u_tex,v_uv).rgb*.227027;
 c+=texture2D(u_tex,v_uv+u_dir*1.384615).rgb*.316216;
 c+=texture2D(u_tex,v_uv-u_dir*1.384615).rgb*.316216;
 c+=texture2D(u_tex,v_uv+u_dir*3.230769).rgb*.070270;
 c+=texture2D(u_tex,v_uv-u_dir*3.230769).rgb*.070270;
 gl_FragColor=vec4(c,1.);
}`);

const compositeP=makeProgram(VS,`
precision highp float;
varying vec2 v_uv;
uniform sampler2D u_scene; uniform sampler2D u_bloom; uniform vec2 u_resolution; uniform float u_bloomStrength;
void main(){
 vec3 c=texture2D(u_scene,v_uv).rgb;
 vec3 b=texture2D(u_bloom,v_uv).rgb;
 c += b*u_bloomStrength;
 // subtle glare echo for lens-like highlight spread
 c += texture2D(u_bloom, .5+(v_uv-.5)*.986).rgb*u_bloomStrength*.18;
 // ACES-ish tone map
 c=(c*(2.51*c+.03))/(c*(2.43*c+.59)+.14);
 c=pow(clamp(c,0.,1.),vec3(.93));
 vec2 p=(v_uv-.5)*vec2(u_resolution.x/u_resolution.y,1.);
 float vig=1.-smoothstep(.34,1.05,dot(p,p));
 c*=.76+.24*vig;
 // slight black floor lift keeps deepest background silky rather than crushed
 c+=vec3(.002,.002,.006);
 gl_FragColor=vec4(c,1.);
}`);

function decayPressure() {
  use(copyP); tex(0,pressure.read.texture,copyP,'u_tex'); gl.uniform1f(U(copyP,'u_scale'),CFG.PRESSURE_DISSIPATION); draw(pressure.write); pressure.swap();
}
function step(dt) {
  gl.disable(gl.BLEND);
  const t=[1/CFG.SIM,1/CFG.SIM];

  use(curlP); tex(0,velocity.read.texture,curlP,'u_velocity'); gl.uniform2f(U(curlP,'u_texel'),t[0],t[1]); draw(curl);

  use(vortP); tex(0,velocity.read.texture,vortP,'u_velocity'); tex(1,curl.texture,vortP,'u_curl');
  gl.uniform2f(U(vortP,'u_texel'),t[0],t[1]); gl.uniform1f(U(vortP,'u_curlStrength'),CFG.CURL); gl.uniform1f(U(vortP,'u_dt'),dt);
  draw(velocity.write); velocity.swap();

  use(divergenceP); tex(0,velocity.read.texture,divergenceP,'u_velocity'); gl.uniform2f(U(divergenceP,'u_texel'),t[0],t[1]); draw(divergence);

  decayPressure();
  use(pressureP); tex(1,divergence.texture,pressureP,'u_divergence'); gl.uniform2f(U(pressureP,'u_texel'),t[0],t[1]);
  for(let i=0;i<CFG.PRESSURE_ITERS;i++){
    tex(0,pressure.read.texture,pressureP,'u_pressure'); draw(pressure.write); pressure.swap();
  }

  use(gradP); tex(0,pressure.read.texture,gradP,'u_pressure'); tex(1,velocity.read.texture,gradP,'u_velocity'); gl.uniform2f(U(gradP,'u_texel'),t[0],t[1]);
  draw(velocity.write); velocity.swap();

  use(advectP); tex(0,velocity.read.texture,advectP,'u_velocity'); tex(1,velocity.read.texture,advectP,'u_source');
  gl.uniform2f(U(advectP,'u_velocityTexel'),t[0],t[1]); gl.uniform1f(U(advectP,'u_dt'),dt); gl.uniform1f(U(advectP,'u_dissipation'),CFG.VELOCITY_DISSIPATION);
  draw(velocity.write); velocity.swap();

  tex(0,velocity.read.texture,advectP,'u_velocity'); tex(1,dye.read.texture,advectP,'u_source');
  gl.uniform2f(U(advectP,'u_velocityTexel'),t[0],t[1]); gl.uniform1f(U(advectP,'u_dt'),dt); gl.uniform1f(U(advectP,'u_dissipation'),CFG.DYE_DISSIPATION);
  draw(dye.write); dye.swap();
}

function splat(x,y,dx,dy,color,radius=CFG.SPLAT_RADIUS,core=.3) {
  const aspect=canvas.width/canvas.height;
  use(splatP);
  tex(0,velocity.read.texture,splatP,'u_target'); gl.uniform2f(U(splatP,'u_point'),x,y); gl.uniform3f(U(splatP,'u_color'),dx,dy,0);
  gl.uniform1f(U(splatP,'u_aspect'),aspect); gl.uniform1f(U(splatP,'u_radius'),radius); gl.uniform1f(U(splatP,'u_core'),.1);
  draw(velocity.write); velocity.swap();

  tex(0,dye.read.texture,splatP,'u_target'); gl.uniform3f(U(splatP,'u_color'),color[0],color[1],color[2]);
  gl.uniform1f(U(splatP,'u_radius'),radius*1.45); gl.uniform1f(U(splatP,'u_core'),core);
  draw(dye.write); dye.swap();
}

// Ink colors are deliberately energy-heavy. Display shader remaps them into spectral material colors.
function spectralColor(seed=Math.random()) {
  const a=seed*Math.PI*2;
  const green=.36+.30*(.5+.5*Math.sin(a));
  const cyan=.18+.26*(.5+.5*Math.sin(a+2.1));
  const violet=.28+.34*(.5+.5*Math.sin(a+4.2));
  return [violet,green,cyan];
}
function burst(n=18, center=null) {
  for(let i=0;i<n;i++){
    const ang=Math.random()*Math.PI*2;
    const rr=Math.pow(Math.random(),.7)*.18;
    const x=center?center[0]+Math.cos(ang)*rr:.12+Math.random()*.76;
    const y=center?center[1]+Math.sin(ang)*rr:.15+Math.random()*.70;
    const strength=550+Math.random()*1350;
    const dx=Math.cos(ang)*strength+(Math.random()-.5)*450;
    const dy=Math.sin(ang)*strength+(Math.random()-.5)*450;
    splat(x,y,dx,dy,spectralColor(Math.random()),CFG.SPLAT_RADIUS*(.65+Math.random()*1.8),.25+Math.random()*.6);
  }
}

// ---------- pointer interaction ----------
const pointers=new Map();
function posFromEvent(e){
  const r=canvas.getBoundingClientRect();
  return [(e.clientX-r.left)/r.width, 1-(e.clientY-r.top)/r.height];
}
canvas.addEventListener('pointerdown',e=>{
  canvas.setPointerCapture?.(e.pointerId);
  const p=posFromEvent(e);
  pointers.set(e.pointerId,{x:p[0],y:p[1],px:p[0],py:p[1],color:spectralColor(Math.random()),moved:false,t:performance.now()});
  // A tiny pressure + dye impulse makes taps feel alive.
  splat(p[0],p[1],(Math.random()-.5)*90,(Math.random()-.5)*90,spectralColor(Math.random()),CFG.SPLAT_RADIUS*1.35,.75);
  hint.classList.add('hide');
});
canvas.addEventListener('pointermove',e=>{
  const p=pointers.get(e.pointerId); if(!p)return;
  const q=posFromEvent(e); p.px=p.x;p.py=p.y;p.x=q[0];p.y=q[1];p.moved=true;
});
function endPointer(e){pointers.delete(e.pointerId);}
canvas.addEventListener('pointerup',endPointer); canvas.addEventListener('pointercancel',endPointer);

function applyPointers(){
  for(const p of pointers.values()){
    if(!p.moved)continue; p.moved=false;
    let dx=(p.x-p.px)*CFG.FORCE, dy=(p.y-p.py)*CFG.FORCE;
    const mag=Math.hypot(dx,dy); if(mag>1200){dx*=1200/mag;dy*=1200/mag;}
    splat(p.x,p.y,dx,dy,p.color,CFG.SPLAT_RADIUS*(.85+Math.min(mag/1800,.9)),.42);
  }
}

// ---------- autonomous plume emitter ----------
let autoPhase=Math.random()*20, autoAccumulator=0;
function autoPlume(dt,t){
  if(!CFG.AUTO)return;
  autoAccumulator+=dt;
  const interval=.072;
  while(autoAccumulator>interval){
    autoAccumulator-=interval;
    autoPhase+=.12;
    const x=.5 + Math.sin(autoPhase*.77)*.155 + Math.sin(autoPhase*1.91)*.035;
    const y=.15 + .025*Math.sin(autoPhase*.61);
    const dx=105*Math.sin(autoPhase*1.34)+36*Math.sin(autoPhase*2.71);
    const dy=720+120*Math.cos(autoPhase*.83);
    const c=spectralColor(.5+.5*Math.sin(autoPhase*.17));
    splat(x,y,dx,dy,c,CFG.SPLAT_RADIUS*.74,.36);
    // opposing side curls create mushroom / ink-in-water folds
    if(Math.sin(autoPhase*.43)>.78) splat(x+.02*Math.sin(autoPhase),y+.012,-dx*.7,dy*.45,spectralColor(Math.random()),CFG.SPLAT_RADIUS*.52,.24);
  }
}

function render(time){
  const glass=CFG.GLASS?CFG.GLASS_STRENGTH:0;
  use(sceneP); tex(0,dye.read.texture,sceneP,'u_dye'); tex(1,velocity.read.texture,sceneP,'u_velocity');
  gl.uniform2f(U(sceneP,'u_resolution'),canvas.width,canvas.height); gl.uniform1f(U(sceneP,'u_time'),time); gl.uniform1f(U(sceneP,'u_glass'),glass);
  draw(scene);

  use(brightP); tex(0,scene.texture,brightP,'u_scene'); draw(bloomA);
  use(blurP);
  for(let i=0;i<4;i++){
    tex(0,bloomA.texture,blurP,'u_tex'); gl.uniform2f(U(blurP,'u_dir'),1/bloomA.w,0); draw(bloomB);
    tex(0,bloomB.texture,blurP,'u_tex'); gl.uniform2f(U(blurP,'u_dir'),0,1/bloomA.h); draw(bloomA);
  }

  use(compositeP); tex(0,scene.texture,compositeP,'u_scene'); tex(1,bloomA.texture,compositeP,'u_bloom');
  gl.uniform2f(U(compositeP,'u_resolution'),canvas.width,canvas.height); gl.uniform1f(U(compositeP,'u_bloomStrength'),CFG.BLOOM_STRENGTH);
  draw(null);
}

function clearAll(){
  [velocity.read,velocity.write,dye.read,dye.write,pressure.read,pressure.write,divergence,curl].forEach(f=>{
    gl.bindFramebuffer(gl.FRAMEBUFFER,f.fbo); gl.viewport(0,0,f.w,f.h); gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
  });
}

document.getElementById('burst').onclick=()=>burst(22,[.5,.48]);
document.getElementById('clear').onclick=()=>clearAll();
document.getElementById('auto').onclick=e=>{CFG.AUTO=!CFG.AUTO;e.currentTarget.classList.toggle('active',CFG.AUTO);};
document.getElementById('glass').onclick=e=>{CFG.GLASS=!CFG.GLASS;e.currentTarget.classList.toggle('active',CFG.GLASS);};
setTimeout(()=>hint.classList.add('hide'),6500);

// Seed with tall emerald/violet ink folds rather than random screen noise.
for(let i=0;i<11;i++){
  const x=.29+i*.042 + (Math.random()-.5)*.015;
  splat(x,.17+(Math.random()-.5)*.02,(Math.random()-.5)*260,650+Math.random()*420,spectralColor(i/10),CFG.SPLAT_RADIUS*(.7+Math.random()*.65),.45);
}
burst(8,[.53,.40]);

let last=performance.now();
function frame(now){
  resizePost();
  let dt=Math.min((now-last)/1000,.020); last=now;
  if(document.hidden) dt=.0;
  applyPointers();
  autoPlume(dt,now*.001);
  if(dt>0) step(dt);
  render(now*.001);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
