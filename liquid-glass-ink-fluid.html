<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Liquid Glass Ink / Smoke Fluid</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #050508;
    font-family: system-ui, -apple-system, sans-serif;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
  }
  .hint {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.45);
    font-size: 13px;
    letter-spacing: 0.04em;
    pointer-events: none;
    text-align: center;
    transition: opacity 1.2s ease;
  }
  .hint.fade { opacity: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint" id="hint">Drag to stir the ink · Liquid Glass refraction</div>

<script>
// ─────────────────────────────────────────────────────────────
// Liquid Glass Ink / Smoke Fluid
// Navier-Stokes (simplified GPU) + color advection + refractive glass look
// ─────────────────────────────────────────────────────────────

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { alpha: false, antialias: false, preserveDrawingBuffer: false });
if (!gl) { alert('WebGL required'); throw new Error('no webgl'); }

const EXT = {
  float: gl.getExtension('OES_texture_float'),
  floatLinear: gl.getExtension('OES_texture_float_linear'),
  halfFloat: gl.getExtension('OES_texture_half_float'),
  halfFloatLinear: gl.getExtension('OES_texture_half_float_linear'),
};
const hasFloat = !!(EXT.float || EXT.halfFloat);
const texType = EXT.float ? gl.FLOAT : (EXT.halfFloat ? EXT.halfFloat.HALF_FLOAT_OES : gl.UNSIGNED_BYTE);

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = Math.floor(innerWidth  * dpr);
  canvas.height = Math.floor(innerHeight * dpr);
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

// ── helpers ──────────────────────────────────────────────────
function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s));
    throw new Error('shader compile');
  }
  return s;
}
function program(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(p));
    throw new Error('link');
  }
  return p;
}

const VS = `
attribute vec2 a_pos;
varying vec2 v_uv;
void main() {
  v_uv = a_pos * 0.5 + 0.5;
  gl_Position = vec4(a_pos, 0.0, 1.0);
}`;

// ── simulation resolution (lower = faster / more abstract) ──
const SIM_RES = 256;
const DYE_RES = 512;

function createFBO(w, h, type = texType) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, type, null);

  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.viewport(0, 0, w, h);
  gl.clear(gl.COLOR_BUFFER_BIT);

  return { tex, fbo, w, h };
}

function createDouble(w, h) {
  return { read: createFBO(w, h), write: createFBO(w, h), swap() {
    const t = this.read; this.read = this.write; this.write = t;
  }};
}

const velocity = createDouble(SIM_RES, SIM_RES);
const density  = createDouble(DYE_RES, DYE_RES);
const pressure = createDouble(SIM_RES, SIM_RES);
const divergence = createFBO(SIM_RES, SIM_RES);
const curl       = createFBO(SIM_RES, SIM_RES);

// full-screen quad
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

function bindQuad(prog) {
  const loc = gl.getAttribLocation(prog, 'a_pos');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
}

function blit(target) {
  if (target == null) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
  } else {
    gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
    gl.viewport(0, 0, target.w, target.h);
  }
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// ── shaders ──────────────────────────────────────────────────
const clearProg = program(VS, `
precision mediump float;
varying vec2 v_uv;
uniform float value;
void main() { gl_FragColor = vec4(value); }
`);

const splatProg = program(VS, `
precision highp float;
varying vec2 v_uv;
uniform sampler2D u_target;
uniform float aspect;
uniform vec3  color;
uniform vec2  point;
uniform float radius;
void main() {
  vec2 p = v_uv - point.xy;
  p.x *= aspect;
  vec3 splat = exp(-dot(p,p) / radius) * color;
  vec3 base  = texture2D(u_target, v_uv).xyz;
  gl_FragColor = vec4(base + splat, 1.0);
}
`);

const advectProg = program(VS, `
precision highp float;
varying vec2 v_uv;
uniform sampler2D u_velocity;
uniform sampler2D u_source;
uniform vec2 texel;
uniform float dt;
uniform float dissipation;
void main() {
  vec2 coord = v_uv - dt * texture2D(u_velocity, v_uv).xy * texel;
  gl_FragColor = dissipation * texture2D(u_source, coord);
}
`);

const divergenceProg = program(VS, `
precision mediump float;
varying vec2 v_uv;
uniform sampler2D u_velocity;
uniform vec2 texel;
void main() {
  float L = texture2D(u_velocity, v_uv - vec2(texel.x, 0.0)).x;
  float R = texture2D(u_velocity, v_uv + vec2(texel.x, 0.0)).x;
  float T = texture2D(u_velocity, v_uv + vec2(0.0, texel.y)).y;
  float B = texture2D(u_velocity, v_uv - vec2(0.0, texel.y)).y;
  float div = 0.5 * (R - L + T - B);
  gl_FragColor = vec4(div, 0.0, 0.0, 1.0);
}
`);

const curlProg = program(VS, `
precision mediump float;
varying vec2 v_uv;
uniform sampler2D u_velocity;
uniform vec2 texel;
void main() {
  float L = texture2D(u_velocity, v_uv - vec2(texel.x, 0.0)).y;
  float R = texture2D(u_velocity, v_uv + vec2(texel.x, 0.0)).y;
  float T = texture2D(u_velocity, v_uv + vec2(0.0, texel.y)).x;
  float B = texture2D(u_velocity, v_uv - vec2(0.0, texel.y)).x;
  float vort = R - L - T + B;
  gl_FragColor = vec4(0.5 * vort, 0.0, 0.0, 1.0);
}
`);

const vorticityProg = program(VS, `
precision highp float;
varying vec2 v_uv;
uniform sampler2D u_velocity;
uniform sampler2D u_curl;
uniform vec2 texel;
uniform float curl_strength;
uniform float dt;
void main() {
  float L = texture2D(u_curl, v_uv - vec2(texel.x, 0.0)).x;
  float R = texture2D(u_curl, v_uv + vec2(texel.x, 0.0)).x;
  float T = texture2D(u_curl, v_uv + vec2(0.0, texel.y)).x;
  float B = texture2D(u_curl, v_uv - vec2(0.0, texel.y)).x;
  float C = texture2D(u_curl, v_uv).x;
  vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
  force /= length(force) + 0.0001;
  force *= curl_strength * C;
  force.y *= -1.0;
  vec2 vel = texture2D(u_velocity, v_uv).xy;
  gl_FragColor = vec4(vel + force * dt, 0.0, 1.0);
}
`);

const pressureProg = program(VS, `
precision mediump float;
varying vec2 v_uv;
uniform sampler2D u_pressure;
uniform sampler2D u_divergence;
uniform vec2 texel;
void main() {
  float L = texture2D(u_pressure, v_uv - vec2(texel.x, 0.0)).x;
  float R = texture2D(u_pressure, v_uv + vec2(texel.x, 0.0)).x;
  float T = texture2D(u_pressure, v_uv + vec2(0.0, texel.y)).x;
  float B = texture2D(u_pressure, v_uv - vec2(0.0, texel.y)).x;
  float C = texture2D(u_divergence, v_uv).x;
  float pressure = (L + R + B + T - C) * 0.25;
  gl_FragColor = vec4(pressure, 0.0, 0.0, 1.0);
}
`);

const gradientProg = program(VS, `
precision mediump float;
varying vec2 v_uv;
uniform sampler2D u_pressure;
uniform sampler2D u_velocity;
uniform vec2 texel;
void main() {
  float L = texture2D(u_pressure, v_uv - vec2(texel.x, 0.0)).x;
  float R = texture2D(u_pressure, v_uv + vec2(texel.x, 0.0)).x;
  float T = texture2D(u_pressure, v_uv + vec2(0.0, texel.y)).x;
  float B = texture2D(u_pressure, v_uv - vec2(0.0, texel.y)).x;
  vec2 vel = texture2D(u_velocity, v_uv).xy;
  vel.xy -= vec2(R - L, T - B);
  gl_FragColor = vec4(vel, 0.0, 1.0);
}
`);

// Final display: iridescent green/purple + refractive glass distortion
const displayProg = program(VS, `
precision highp float;
varying vec2 v_uv;
uniform sampler2D u_density;
uniform sampler2D u_velocity;
uniform vec2  resolution;
uniform float time;

// Simple hash for subtle noise
float hash(vec2 p) {
  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

void main() {
  vec2 uv = v_uv;

  // Sample density & velocity
  vec3 dens = texture2D(u_density, uv).rgb;
  vec2 vel  = texture2D(u_velocity, uv).xy;

  // Refractive "glass" displacement driven by density gradient + velocity
  float densAmt = length(dens);
  vec2 grad = vec2(
    length(texture2D(u_density, uv + vec2(1.5/resolution.x, 0.0)).rgb) -
    length(texture2D(u_density, uv - vec2(1.5/resolution.x, 0.0)).rgb),
    length(texture2D(u_density, uv + vec2(0.0, 1.5/resolution.y)).rgb) -
    length(texture2D(u_density, uv - vec2(0.0, 1.5/resolution.y)).rgb)
  );

  // Stronger refraction where ink is dense → liquid glass lensing
  float refractStrength = densAmt * 0.035 + length(vel) * 0.008;
  vec2 refractedUV = uv - grad * refractStrength * 12.0;

  // Re-sample density through the warped UVs (glass distortion)
  dens = texture2D(u_density, refractedUV).rgb;
  densAmt = length(dens);

  // Iridescent green ↔ purple palette
  // Base: deep emerald → violet with velocity-driven shift
  float hueShift = dens.r * 0.6 + dens.g * 0.3 + dens.b * 0.8 + length(vel) * 0.4;
  vec3 green  = vec3(0.05, 0.85, 0.55);
  vec3 purple = vec3(0.55, 0.15, 0.95);
  vec3 cyan   = vec3(0.1, 0.95, 0.9);
  vec3 col = mix(green, purple, smoothstep(0.0, 1.2, hueShift));
  col = mix(col, cyan, dens.b * 0.35);

  // Brightness & contrast
  col *= densAmt * 1.8;
  col = pow(col, vec3(0.85));           // slight gamma lift
  col += dens * 0.15;                   // keep original color bleed

  // Soft specular / glass highlight from density edges
  float edge = length(grad) * 4.0;
  col += vec3(0.6, 0.9, 1.0) * edge * densAmt * 0.25;

  // Very subtle film grain
  float grain = (hash(uv * resolution + time) - 0.5) * 0.03;
  col += grain;

  // Dark background
  vec3 bg = vec3(0.02, 0.015, 0.03);
  col = mix(bg, col, smoothstep(0.0, 0.08, densAmt));

  // Vignette
  float vig = 1.0 - smoothstep(0.4, 1.4, length(uv - 0.5) * 1.4);
  col *= vig;

  gl_FragColor = vec4(col, 1.0);
}
`);

// ── uniforms helpers ─────────────────────────────────────────
function setUniforms(prog, uniforms) {
  for (const [name, val] of Object.entries(uniforms)) {
    const loc = gl.getUniformLocation(prog, name);
    if (loc === null) continue;
    if (typeof val === 'number') gl.uniform1f(loc, val);
    else if (val.length === 2) gl.uniform2f(loc, val[0], val[1]);
    else if (val.length === 3) gl.uniform3f(loc, val[0], val[1], val[2]);
    else if (val.tex !== undefined) {
      gl.activeTexture(gl.TEXTURE0 + val.unit);
      gl.bindTexture(gl.TEXTURE_2D, val.tex);
      gl.uniform1i(loc, val.unit);
    }
  }
}

// ── simulation step ──────────────────────────────────────────
const config = {
  VELOCITY_DISSIPATION: 0.98,
  DENSITY_DISSIPATION:  0.97,
  PRESSURE: 0.8,
  PRESSURE_ITERATIONS: 20,
  CURL: 28,
  SPLAT_RADIUS: 0.0025,
  SPLAT_FORCE: 6000,
};

function step(dt) {
  gl.disable(gl.BLEND);

  // Curl
  gl.useProgram(curlProg);
  bindQuad(curlProg);
  setUniforms(curlProg, {
    u_velocity: { tex: velocity.read.tex, unit: 0 },
    texel: [1/SIM_RES, 1/SIM_RES]
  });
  blit(curl);

  // Vorticity confinement
  gl.useProgram(vorticityProg);
  bindQuad(vorticityProg);
  setUniforms(vorticityProg, {
    u_velocity: { tex: velocity.read.tex, unit: 0 },
    u_curl:     { tex: curl.tex, unit: 1 },
    texel: [1/SIM_RES, 1/SIM_RES],
    curl_strength: config.CURL,
    dt
  });
  blit(velocity.write);
  velocity.swap();

  // Divergence
  gl.useProgram(divergenceProg);
  bindQuad(divergenceProg);
  setUniforms(divergenceProg, {
    u_velocity: { tex: velocity.read.tex, unit: 0 },
    texel: [1/SIM_RES, 1/SIM_RES]
  });
  blit(divergence);

  // Clear pressure
  gl.useProgram(clearProg);
  bindQuad(clearProg);
  setUniforms(clearProg, { value: config.PRESSURE });
  blit(pressure.write);
  pressure.swap();

  // Pressure solve (Jacobi)
  gl.useProgram(pressureProg);
  bindQuad(pressureProg);
  for (let i = 0; i < config.PRESSURE_ITERATIONS; i++) {
    setUniforms(pressureProg, {
      u_pressure:    { tex: pressure.read.tex, unit: 0 },
      u_divergence:  { tex: divergence.tex, unit: 1 },
      texel: [1/SIM_RES, 1/SIM_RES]
    });
    blit(pressure.write);
    pressure.swap();
  }

  // Gradient subtract
  gl.useProgram(gradientProg);
  bindQuad(gradientProg);
  setUniforms(gradientProg, {
    u_pressure: { tex: pressure.read.tex, unit: 0 },
    u_velocity: { tex: velocity.read.tex, unit: 1 },
    texel: [1/SIM_RES, 1/SIM_RES]
  });
  blit(velocity.write);
  velocity.swap();

  // Advect velocity
  gl.useProgram(advectProg);
  bindQuad(advectProg);
  setUniforms(advectProg, {
    u_velocity: { tex: velocity.read.tex, unit: 0 },
    u_source:   { tex: velocity.read.tex, unit: 0 },
    texel: [1/SIM_RES, 1/SIM_RES],
    dt,
    dissipation: config.VELOCITY_DISSIPATION
  });
  blit(velocity.write);
  velocity.swap();

  // Advect density (color)
  setUniforms(advectProg, {
    u_velocity: { tex: velocity.read.tex, unit: 0 },
    u_source:   { tex: density.read.tex, unit: 1 },
    texel: [1/DYE_RES, 1/DYE_RES],
    dt,
    dissipation: config.DENSITY_DISSIPATION
  });
  blit(density.write);
  density.swap();
}

// ── splat (add ink + force) ──────────────────────────────────
function splat(x, y, dx, dy, color) {
  // velocity splat
  gl.useProgram(splatProg);
  bindQuad(splatProg);
  setUniforms(splatProg, {
    u_target: { tex: velocity.read.tex, unit: 0 },
    aspect: canvas.width / canvas.height,
    point: [x, y],
    color: [dx, dy, 0],
    radius: config.SPLAT_RADIUS
  });
  blit(velocity.write);
  velocity.swap();

  // density / color splat
  setUniforms(splatProg, {
    u_target: { tex: density.read.tex, unit: 0 },
    aspect: canvas.width / canvas.height,
    point: [x, y],
    color: color,
    radius: config.SPLAT_RADIUS * 1.4
  });
  blit(density.write);
  density.swap();
}

// ── pointer handling ─────────────────────────────────────────
const pointers = [];
function createPointer() {
  return { id: -1, x: 0, y: 0, dx: 0, dy: 0, down: false, moved: false, color: [0,0,0] };
}
pointers.push(createPointer());

function HSVtoRGB(h, s, v) {
  let r, g, b, i, f, p, q, t;
  i = Math.floor(h * 6);
  f = h * 6 - i;
  p = v * (1 - s);
  q = v * (1 - f * s);
  t = v * (1 - (1 - f) * s);
  switch (i % 6) {
    case 0: r = v; g = t; b = p; break;
    case 1: r = q; g = v; b = p; break;
    case 2: r = p; g = v; b = t; break;
    case 3: r = p; g = q; b = v; break;
    case 4: r = t; g = p; b = v; break;
    case 5: r = v; g = p; b = q; break;
  }
  return [r, g, b];
}

function generateColor() {
  // Biased toward green / purple / cyan iridescence
  const h = 0.35 + Math.random() * 0.45; // green → blue → purple range
  const c = HSVtoRGB(h, 0.85 + Math.random() * 0.15, 0.7 + Math.random() * 0.3);
  return [c[0] * 0.25, c[1] * 0.25, c[2] * 0.25]; // keep splat intensity reasonable
}

function updatePointerDown(p, x, y) {
  p.down = true;
  p.moved = false;
  p.x = x / canvas.width;
  p.y = 1.0 - y / canvas.height;
  p.color = generateColor();
}
function updatePointerMove(p, x, y) {
  if (!p.down) return;
  const nx = x / canvas.width;
  const ny = 1.0 - y / canvas.height;
  p.dx = (nx - p.x) * config.SPLAT_FORCE;
  p.dy = (ny - p.y) * config.SPLAT_FORCE;
  p.x = nx;
  p.y = ny;
  p.moved = true;
}
function updatePointerUp(p) {
  p.down = false;
}

canvas.addEventListener('mousedown', e => {
  const p = pointers[0];
  updatePointerDown(p, e.offsetX * (canvas.width/canvas.clientWidth), e.offsetY * (canvas.height/canvas.clientHeight));
});
canvas.addEventListener('mousemove', e => {
  const p = pointers[0];
  updatePointerMove(p, e.offsetX * (canvas.width/canvas.clientWidth), e.offsetY * (canvas.height/canvas.clientHeight));
});
window.addEventListener('mouseup', () => updatePointerUp(pointers[0]));

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const touches = e.targetTouches;
  for (let i = 0; i < touches.length; i++) {
    if (!pointers[i]) pointers[i] = createPointer();
    const rect = canvas.getBoundingClientRect();
    updatePointerDown(pointers[i],
      (touches[i].clientX - rect.left) * (canvas.width/canvas.clientWidth),
      (touches[i].clientY - rect.top)  * (canvas.height/canvas.clientHeight));
  }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const touches = e.targetTouches;
  for (let i = 0; i < touches.length; i++) {
    if (!pointers[i]) continue;
    const rect = canvas.getBoundingClientRect();
    updatePointerMove(pointers[i],
      (touches[i].clientX - rect.left) * (canvas.width/canvas.clientWidth),
      (touches[i].clientY - rect.top)  * (canvas.height/canvas.clientHeight));
  }
}, { passive: false });
window.addEventListener('touchend', e => {
  const touches = e.changedTouches;
  for (let i = 0; i < touches.length; i++) {
    if (pointers[i]) updatePointerUp(pointers[i]);
  }
});

// ── initial ink burst ────────────────────────────────────────
function multipleSplats(n) {
  for (let i = 0; i < n; i++) {
    const x = Math.random();
    const y = Math.random();
    const dx = 1000 * (Math.random() - 0.5);
    const dy = 1000 * (Math.random() - 0.5);
    splat(x, y, dx, dy, generateColor());
  }
}
multipleSplats(18);

// ── main loop ────────────────────────────────────────────────
let last = performance.now();
let hint = document.getElementById('hint');
setTimeout(() => hint.classList.add('fade'), 4000);

function frame() {
  const now = performance.now();
  let dt = Math.min((now - last) / 1000, 0.0166);
  last = now;

  // Apply pointer forces
  for (const p of pointers) {
    if (p.moved) {
      p.moved = false;
      splat(p.x, p.y, p.dx, p.dy, p.color);
    }
  }

  step(dt);

  // Display
  gl.useProgram(displayProg);
  bindQuad(displayProg);
  setUniforms(displayProg, {
    u_density:  { tex: density.read.tex, unit: 0 },
    u_velocity: { tex: velocity.read.tex, unit: 1 },
    resolution: [canvas.width, canvas.height],
    time: now * 0.001
  });
  blit(null);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
